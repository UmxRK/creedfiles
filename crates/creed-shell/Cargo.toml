[package]
name = "creed-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
creed-core = { path = "../creed-core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
cairo-rs = { version = "0.22", default-features = false, features = ["png"] }
pango = "0.22"
pangocairo = "0.22"
resvg = { version = "0.50", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
accesskit = "0.25"
accesskit_unix = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
