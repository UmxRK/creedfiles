regular0={{ term.0.bare }}
regular1={{ term.1.bare }}
regular2={{ term.2.bare }}
regular3={{ term.3.bare }}
regular4={{ term.4.bare }}
regular5={{ term.5.bare }}
regular6={{ term.6.bare }}
regular7={{ term.7.bare }}
bright0={{ term.8.bare }}
bright1={{ term.9.bare }}
bright2={{ term.10.bare }}
bright3={{ term.11.bare }}
bright4={{ term.12.bare }}
bright5={{ term.13.bare }}
bright6={{ term.14.bare }}
bright7={{ term.15.bare }}
