# Generated by Creed for mode "{{ mode }}" - sourced from ~/.config/hypr/hyprlock.conf
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = {{ lock.wallpaper }}
    color = {{ color.bg.hypr }}
{{! family.macos }}
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
{{/!}}
{{? family.macos }}
    blur_passes = 0
    brightness = 1.0
{{/?}}
}
{{? family.creed }}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = {{ color.text.hypr }}
    font_size = 96
    font_family = {{ font }} Bold
    position = 0, 160
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = {{ color.accent.hypr }}
    font_size = 18
    font_family = {{ font }}
    position = 0, 70
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 54
    rounding = -1
    outline_thickness = 2
    outer_color = {{ color.accent.hypr }}
    inner_color = {{ color.surface.hypr }}
    font_color = {{ color.text.hypr }}
    check_color = {{ color.accent_alt.hypr }}
    fail_color = {{ color.error.hypr }}
    placeholder_text = <i>Password…</i>
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
{{/?}}
{{? family.windows }}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = {{ lock.clock_size }}
    font_family = {{ font }} {{ lock.clock_weight }}
    position = {{ lock.clock_pos }}
    halign = {{ lock.halign }}
    valign = {{ lock.valign }}
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(ffffffee)
    font_size = 26
    font_family = {{ font }}
    position = {{ lock.date_pos }}
    halign = {{ lock.halign }}
    valign = {{ lock.valign }}
}
input-field {
    monitor =
    size = 300, 40
    rounding = {{ lock.rounding }}
    outline_thickness = 1
    outer_color = rgba(ffffff33)
    inner_color = rgba(00000055)
    font_color = rgba(ffffffff)
    check_color = {{ color.accent.hypr }}
    fail_color = {{ color.error.hypr }}
    placeholder_text = PIN or password
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
{{/?}}
{{? family.macos }}
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(ffffffdd)
    font_size = 22
    font_family = {{ font }} Medium
    position = 0, -90
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffee)
    font_size = 104
    font_family = {{ font }} Bold
    position = 0, -130
    halign = center
    valign = top
}
{{? lock.avatar }}
image {
    monitor =
    path = {{ lock.avatar }}
    size = 64
    rounding = -1
    border_size = 0
    position = 0, 196
    halign = center
    valign = bottom
}
{{/?}}
label {
    monitor =
    text = $USER
    color = rgba(ffffffff)
    font_size = 15
    font_family = {{ font }} Medium
    position = 0, 150
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 220, 36
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(ffffff33)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffff66)
    fail_color = {{ color.error.hypr }}
    placeholder_text = Enter Password
    fade_on_empty = false
    position = 0, 96
    halign = center
    valign = bottom
}
{{/?}}
