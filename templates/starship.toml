# Generated by Creed for mode "{{ mode }}".
add_newline = false
format = """$directory$git_branch$git_status$cmd_duration$line_break$character"""

[directory]
style = "bold {{ color.accent }}"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "{{ color.accent_alt }}"
format = "[$symbol$branch]($style) "

[git_status]
style = "{{ color.warning }}"

[cmd_duration]
min_time = 2000
style = "{{ color.muted }}"
format = "[took $duration]($style) "

[character]
success_symbol = "[{{ prompt.symbol }}]({{ color.accent }})"
error_symbol = "[{{ prompt.symbol }}]({{ color.error }})"
