# Creed - Material You on Hyprland (in the style of end-4's illogical-impulse):
# colours from your wallpaper, a flush bar, full-height sidebars, pills everywhere.

[meta]
name = "Creed"
family = "creed"
description = "Material You: colours from your wallpaper, a flush top bar with resources, media and workspaces, and full-height sidebars for quick settings, notifications, the calendar and widgets."
preview = "preview.png"

[appearance]
color_source = "wallpaper"
wallpaper = "creed://dawn"
motion = "expressive"

[bar]
position = "top"
style = "edge"
size = 40
margin = 0
radius = 0
workspaces = 10
left = ["window"]
center = ["resources", "media", "workspaces", "clock", "utilities"]
right = ["tray", "keyboard", "status"]
clock_format = "%H:%M"
date_format = "%A, %d/%m"

[dock]
enabled = false
position = "bottom"
icon_size = 44
magnify = 1.0
margin = 8

[glass]
refraction = 0.0
frost = 0.78
specular = 0.25

[style]
radius = 20
radius_small = 12
spacing = 8
padding = 12
material = "frost"
window_mode = "tile"
titlebar = "none"
icon_theme = "Papirus-{Scheme}, Papirus"
cursor_theme = "Adwaita"
gtk_theme = "adw-gtk3{-dark}"
shell_icons = "Creed-Material"
font = "Rubik, Inter"
bar = "material"
dock = "creed"
launcher = "creed"
control = "sidebar"
overview = "creed"
dashboard = "sidebar"
notifications = "material"
osd = "material"
window_gaps_in = 5
window_gaps_out = 12
window_rounding = 16
window_border = 2
